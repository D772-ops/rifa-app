<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DREAMS RIFA</title>
<style>
:root{--bg:#0A000A;--panel:#1a0820;--line:#4A004A;--txt:#f7eaff;--mut:#c89bd6;
--pri:#FF00FF;--pri2:#FF33CC;--gold:#FFD700;--free:#2a0e33;--res:#FFD700;--paid:#22c186;--win:#FF00FF;--wa:#25D366}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;color:var(--txt);
background:radial-gradient(900px 500px at 70% -10%,#4A004A,transparent),radial-gradient(700px 400px at 10% 110%,#2a0030,transparent),var(--bg);padding:16px;min-height:100vh}
#app{max-width:720px;margin:0 auto}
header{text-align:center;margin-bottom:14px}
.logo-img{max-width:min(420px,86%);width:auto;height:auto;margin:4px auto 2px;display:block;filter:drop-shadow(0 0 16px rgba(255,0,255,.35))}
.logo{font-size:40px;font-weight:900;letter-spacing:2px;line-height:1.05;
background:linear-gradient(180deg,#FF66DD 0%,#FF00FF 45%,#FFD700 100%);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
filter:drop-shadow(0 0 10px rgba(255,0,255,.55))}
.slogan{color:var(--gold);font-size:15px;font-style:italic;margin-top:6px;text-shadow:0 0 8px rgba(255,215,0,.5)}
header .sub{color:var(--mut);font-size:13px;margin-top:4px}
/* ----- Landing: tarjetas de rifas ----- */
.sectitle{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:18px 2px 10px}
.sectitle::after{content:'';flex:1;height:1px;background:var(--line)}
.rcards{display:flex;flex-direction:column;gap:12px}
.rcard{display:block;text-align:left;width:100%;cursor:pointer;color:var(--txt);
background:linear-gradient(135deg,rgba(255,0,255,.10),rgba(74,0,74,.28));
border:1px solid var(--pri);border-radius:16px;padding:16px;box-shadow:0 0 16px rgba(255,0,255,.14);transition:.14s}
.rcard:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(255,0,255,.26)}
.rcard.soon{border-color:var(--gold);opacity:.92;cursor:default;background:linear-gradient(135deg,rgba(255,215,0,.10),rgba(74,0,74,.22))}
.rcard .rtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rcard .rname{font-size:20px;font-weight:800}
.rbadge{font-size:11px;font-weight:800;border-radius:8px;padding:3px 9px;white-space:nowrap}
.rbadge.on{background:#0f3528;color:#5ef0b8;border:1px solid var(--paid)}
.rbadge.soon{background:#3a2e05;color:var(--gold);border:1px solid var(--gold)}
.rcard .rslo{color:var(--gold);font-style:italic;font-size:13px;margin-top:3px}
.rcard .rmeta{color:var(--mut);font-size:13px;margin-top:8px;line-height:1.6}
.rcard .rmeta b{color:var(--txt)}
.rcard .rprize{color:var(--gold);font-weight:800;text-shadow:0 0 8px rgba(255,215,0,.4)}
.rcard .rgo{display:inline-block;margin-top:10px;font-weight:800;color:var(--pri2)}
.rchips{display:flex;gap:10px;margin-top:9px;flex-wrap:wrap}
.chip{font-size:12px;border-radius:20px;padding:4px 10px;border:1px solid var(--line);color:var(--mut)}
.chip b{color:var(--txt)}
/* ----- Grupos WhatsApp ----- */
.groups{display:flex;flex-direction:column;gap:10px}
.gbtn{display:flex;align-items:center;gap:12px;width:100%;text-decoration:none;color:var(--txt);
background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;transition:.14s}
.gbtn:hover{border-color:var(--wa);box-shadow:0 0 14px rgba(37,211,102,.25);transform:translateY(-1px)}
.gbtn .wa{width:30px;height:30px;flex:none}
.wa-section{margin-top:8px}
.empty{color:var(--mut);text-align:center;padding:22px;border:1px dashed var(--line);border-radius:14px;font-size:14px}
/* ----- Board (tablero de una rifa) ----- */
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.backbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.prizes{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.prize{display:flex;justify-content:space-between;align-items:center;gap:10px;
background:linear-gradient(135deg,rgba(255,0,255,.12),rgba(74,0,74,.3));
border:1px solid var(--pri);border-radius:12px;padding:11px 14px;box-shadow:0 0 14px rgba(255,0,255,.18)}
.prize .pl{font-size:14px;color:var(--txt);font-weight:600}
.prize .pa{font-size:17px;font-weight:800;color:var(--gold);text-shadow:0 0 8px rgba(255,215,0,.45);white-space:nowrap}
.prize.main{background:linear-gradient(135deg,rgba(255,215,0,.18),rgba(255,0,255,.18));border-color:var(--gold);box-shadow:0 0 20px rgba(255,215,0,.3)}
.prize.main .pa{font-size:21px}
.sharebar{margin:14px 0;display:flex;flex-direction:column;gap:10px}
.btn-share{width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;
color:#0A000A;background:linear-gradient(135deg,var(--gold),#ffe766);box-shadow:0 0 16px rgba(255,215,0,.4)}
.btn-wa{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;color:#fff;background:var(--wa);box-shadow:0 0 16px rgba(37,211,102,.4)}
.btn-wa .wa{width:24px;height:24px}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;text-align:center;font-size:14px}
.banner b{color:var(--pri2)}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:12px}
.cell{aspect-ratio:1/1;border-radius:11px;border:1px solid var(--line);background:var(--free);
display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
cursor:pointer;transition:.12s;position:relative;font-variant-numeric:tabular-nums}
.cell:hover{transform:translateY(-2px)}
.cell.available{color:#e9c9f3}
.cell.reserved{background:#3a2e05;border-color:var(--res);color:var(--res);cursor:not-allowed}
.cell.paid{background:#0f3528;border-color:var(--paid);color:var(--paid);cursor:not-allowed}
.cell.winner{background:#4a1526;border-color:var(--win);box-shadow:0 0 0 2px var(--win)}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;color:var(--mut);font-size:13px;margin:14px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.i-free{background:var(--free);border:1px solid var(--line)}.i-res{background:var(--res)}
.i-paid{background:var(--paid)}.i-win{background:var(--win)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:18px}
.modal-bg{position:fixed;inset:0;background:rgba(5,7,16,.7);display:none;z-index:40}
.modal-bg.show{display:block}
.modal{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);
width:min(440px,94vw);max-height:92vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:none}
.modal.show{display:block}
.modal h2{font-size:19px;margin-bottom:6px}
.modal .pick{color:var(--pri2);font-weight:700}
.field{margin:12px 0}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;font-size:15px}
.pay-opts{display:flex;gap:10px;margin:14px 0}
.pay-opt{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-size:13px}
.pay-opt.on{border-color:var(--pri2);background:#232a4a}
.pay-opt .big{font-size:22px;display:block;margin-bottom:4px}
.btn{width:100%;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;color:#fff}
.btn.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 0 16px rgba(255,0,255,.4)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500;margin-top:8px}
.note{font-size:12px;color:var(--mut);margin-top:12px;line-height:1.5}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
background:#111633;border:1px solid var(--pri);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.qr-box{text-align:center}
.qr-img{width:230px;max-width:80%;background:#fff;border-radius:14px;padding:10px;margin:6px auto 2px;display:block}
.amount{font-size:28px;font-weight:800;color:var(--paid);margin:6px 0}
.llave{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bg);
border:1px dashed var(--pri2);border-radius:10px;padding:10px;margin:10px 0;font-size:17px;font-weight:700;letter-spacing:1px}
.benef{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--mut);margin:8px 0}
.benef b{color:var(--txt)}
.steps{text-align:left;font-size:13px;line-height:1.7;color:var(--txt);padding-left:18px;margin:8px 0}
.copybtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;width:auto}
.badge-breb{display:inline-block;background:#2a1a4a;color:#c3b6ff;border:1px solid var(--pri);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700}
.hidden{display:none!important}
@media(max-width:560px){.board{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <img class="logo-img hidden" id="logoImg" alt="DREAMS RIFA">
    <div class="logo hidden" id="logoTxt">DREAMS RIFA</div>
    <div class="slogan" id="brandSlogan"></div>
    <div class="sub" id="brandIntro"></div>
  </header>

  <!-- VISTA 1: PAGINA PRINCIPAL (lista de rifas) -->
  <section id="home">
    <div class="sectitle">Rifas disponibles</div>
    <div class="rcards" id="rcards"></div>
    <div class="wagroups-wrap" id="waWrap"></div>
    <div class="foot">Elige una rifa para ver su tablero y participar.</div>
  </section>

  <!-- VISTA 2: TABLERO DE UNA RIFA -->
  <section id="board-view" class="hidden">
    <div class="backbar"><button class="backbtn" onclick="goHome()">← Volver a las rifas</button></div>
    <div class="prizes" id="prizes"></div>
    <div class="banner" id="banner"></div>
    <div class="sharebar">
      <button class="btn-share" id="shareBtn">📲 Descargar imagen para WhatsApp</button>
      <a class="btn-wa hidden" id="waBtn" target="_blank" rel="noopener"><svg class="wa" viewBox="0 0 32 32" fill="#fff"><path d="M16 3C9 3 3.5 8.5 3.5 15.5c0 2.4.7 4.6 1.8 6.5L3 29l7.2-2.3c1.8 1 3.9 1.5 6 1.5 6.9 0 12.5-5.5 12.5-12.5S23 3 16 3zm0 22.6c-1.9 0-3.7-.5-5.3-1.5l-.4-.2-4.3 1.4 1.4-4.2-.2-.4c-1-1.6-1.6-3.5-1.6-5.5C5.8 9.8 10.4 5.3 16 5.3s10.2 4.5 10.2 10.2S21.6 25.6 16 25.6zm5.7-7.6c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2s-.8 1-1 1.2c-.2.2-.4.2-.7.1-1.8-.9-3-1.6-4.2-3.6-.3-.5.3-.5.8-1.6.1-.2 0-.4 0-.5s-.7-1.7-1-2.3c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4s-1 1-1 2.5 1.1 2.9 1.2 3.1c.2.2 2.1 3.3 5.2 4.6 2 .8 2.7.9 3.7.8.6-.1 1.8-.7 2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg><span id="waBtnLabel">Unirme al grupo de WhatsApp</span></a>
    </div>
    <div class="board" id="board"></div>
    <div class="legend">
      <span><i class="i-free"></i>Libre</span>
      <span><i class="i-res"></i>Reservado</span>
      <span><i class="i-paid"></i>Pagado</span>
      <span><i class="i-win"></i>Ganador</span>
    </div>
    <div class="foot">Elige un número libre para participar.</div>
  </section>
</div>

<div class="modal-bg" id="mbg"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
