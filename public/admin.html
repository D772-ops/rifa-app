<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rifa Diaria — Administración</title>
<style>
:root{--bg:#0f1220;--panel:#1a1f36;--panel2:#232a4a;--line:#2e3760;--txt:#eef1ff;--mut:#9aa3c8;
--pri:#6c5ce7;--pri2:#8b7bf0;--free:#2f3760;--res:#f0a030;--paid:#22c186;--win:#e74c6b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;color:var(--txt);
background:radial-gradient(1200px 600px at 70% -10%,#20264a,transparent),var(--bg);padding:16px}
#app{max-width:960px;margin:0 auto}
.login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.login h1{font-size:22px;margin-bottom:6px}.login p{color:var(--mut);font-size:14px;margin-bottom:16px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;font-size:14px;width:100%;font-family:inherit}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--pri2)}
.btn.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));border:none;font-weight:600}
.btn.ok{background:#143a2c;border-color:#1f5a44;color:#9cf0cc}
.btn.danger{background:#3a1c2a;border-color:#5a2a3c;color:#ffb3c6}
.btn.block{width:100%;margin-top:10px}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.topbar h1{font-size:20px}.topbar .sub{color:var(--mut);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .n{font-size:22px;font-weight:700}.stat .t{font-size:12px;color:var(--mut)}
.stat.money .n{color:var(--paid)}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.cell{aspect-ratio:1/1;border-radius:11px;border:1px solid var(--line);background:var(--free);
display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:700;position:relative}
.cell .num{font-size:17px}.cell .who{font-size:9px;color:var(--mut);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.reserved{background:#3a2e12;border-color:var(--res);color:var(--res)}
.cell.paid{background:#0f3528;border-color:var(--paid);color:var(--paid)}
.cell.winner{box-shadow:0 0 0 2px var(--win)}
.cell.claimed{box-shadow:0 0 0 2px var(--pri2)}
.cell .flag{position:absolute;top:3px;right:4px;font-size:10px}
.alert{background:#2a1a4a;border:1px solid var(--pri);color:#d7ccff;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.rcpt{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.qr-prev{width:120px;background:#fff;border-radius:10px;padding:6px;margin-top:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin:14px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px}
.i-free{background:var(--free);border:1px solid var(--line)}.i-res{background:var(--res)}.i-paid{background:var(--paid)}.i-win{background:var(--win)}
.modal-bg{position:fixed;inset:0;background:rgba(5,7,16,.7);display:none;z-index:40}
.modal-bg.show{display:block}
.modal{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,94vw);
max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:none}
.modal.show{display:block}
.modal h2{font-size:18px;margin-bottom:12px}
.modal .close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btns{display:flex;gap:10px;margin-top:14px}.btns .btn{flex:1}
.info{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;line-height:1.6}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.res{background:#3a2e12;color:var(--res)}.pill.paid{background:#0f3528;color:var(--paid)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);position:sticky;top:0;background:var(--panel)}.tablewrap{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.mini{font-size:11px;color:var(--mut)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#111633;
border:1px solid var(--pri);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:620px){.board{grid-template-columns:repeat(5,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-bg" id="mbg"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
<script>
let PASS = sessionStorage.getItem('rifa_admin_pass')||'';
let S=null, filter='all';
const $=id=>document.getElementById(id);
function pad(n){return String(n).padStart(2,'0');}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}
function money(n){return (S?S.cfg.currency:'')+' '+Number(n||0).toLocaleString('es-CO');}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);}
function openModal(h){const m=$('modal');m.innerHTML='<button class="close">×</button>'+h;m.querySelector('.close').onclick=closeModal;$('mbg').classList.add('show');m.classList.add('show');}
function closeModal(){$('modal').classList.remove('show');$('mbg').classList.remove('show');}
$('mbg').onclick=closeModal;

async function api(url,body){
  const opt={headers:{'x-admin-pass':PASS}};
  if(body){opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  const r=await fetch(url,opt);
  if(r.status===401){ PASS=''; sessionStorage.removeItem('rifa_admin_pass'); renderLogin('Clave incorrecta o sesión expirada'); throw new Error('401'); }
  return r.json();
}

function renderLogin(msg){
  $('app').innerHTML=
    '<div class="login"><h1>🔒 Administración</h1><p>'+(msg||'Ingresa la clave para gestionar la rifa')+'</p>'+
    '<div class="field"><input id="pw" type="password" placeholder="Clave de administrador"></div>'+
    '<button class="btn primary block" onclick="doLogin()">Entrar</button></div>';
  $('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  $('pw').focus();
}
async function doLogin(){
  PASS=$('pw').value;
  try{ const r=await (await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS})})).json();
    if(r.ok){ sessionStorage.setItem('rifa_admin_pass',PASS); loadAndRender(); }
    else renderLogin('Clave incorrecta');
  }catch(e){ renderLogin('Error de conexión'); }
}

async function loadAndRender(){
  try{ S=await api('/api/admin/state'); }catch(e){ return; }
  renderShell();
}

function renderShell(){
  const claimed=Object.values(S.numbers).filter(n=>n.status==='reserved'&&n.claimed).length;
  $('app').innerHTML=
    '<div class="topbar"><div><h1 id="rn"></h1><div class="sub" id="sd"></div></div>'+
    '<div class="tools">'+
      '<button class="btn" onclick="openBuyers()">📋 Participantes</button>'+
      '<button class="btn primary" onclick="openDraw()">🎰 Sorteo</button>'+
      '<button class="btn" onclick="openConfig()">⚙️ Config</button>'+
      '<button class="btn" onclick="openMenu()">⋮</button>'+
    '</div></div>'+
    (claimed>0?'<div class="alert">🔔 <b>'+claimed+'</b> pago(s) por confirmar (el cliente marcó “Ya transferí”). Revísalos y confirma.</div>':'')+
    '<div class="stats" id="stats"></div>'+
    '<div class="board" id="board"></div>'+
    '<div class="legend"><span><i class="i-free"></i>Libre</span><span><i class="i-res"></i>Reservado</span>'+
    '<span><i class="i-paid"></i>Pagado</span><span><i class="i-win"></i>Ganador</span>'+
    '<span>🔔 por confirmar</span>'+
    '<span style="margin-left:auto;color:var(--mut)">MP: '+(S.mp?'<b style="color:var(--paid)">activo</b>':'off')+' · Bre-B: '+((S.cfg.breb&&S.cfg.breb.enabled)?'<b style="color:var(--paid)">activo</b>':'off')+'</span></div>';
  $('rn').textContent=S.cfg.raffleName;
  $('sd').textContent=new Date(S.date+'T00:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+'  •  sorteo '+S.cfg.drawTime;
  renderStats(); renderBoard();
}
function renderStats(){
  let free=0,res=0,paid=0;
  for(const k in S.numbers){const s=S.numbers[k].status;if(s==='available')free++;else if(s==='reserved')res++;else paid++;}
  $('stats').innerHTML=
    st(free,'Libres')+st(res,'Reservados')+st(paid,'Pagados')+
    '<div class="stat money"><div class="n">'+money(paid*(S.cfg.price||0))+'</div><div class="t">Recaudado</div></div>';
}
function st(n,t){return '<div class="stat"><div class="n">'+n+'</div><div class="t">'+t+'</div></div>';}
function renderBoard(){
  const b=$('board');b.innerHTML='';
  for(let i=0;i<100;i++){
    const k=pad(i),n=S.numbers[k],isW=S.winner===k;
    const c=document.createElement('div');
    c.className='cell '+n.status+(isW?' winner':'')+(n.status==='reserved'&&n.claimed?' claimed':'');
    let f=n.status==='reserved'?(n.claimed?'🔔':'⏳'):n.status==='paid'?'✅':''; if(isW)f='🏆';
    c.innerHTML='<span class="flag">'+f+'</span><span class="num">'+k+'</span>'+(n.buyer?'<span class="who">'+esc(n.buyer)+'</span>':'');
    c.onclick=()=>openCell(k);
    b.appendChild(c);
  }
}
/* ---- Acciones por numero ---- */
function openCell(k){
  const n=S.numbers[k];
  if(n.status==='available') return formReserve(k);
  const paid=n.status==='paid';
  const methodTxt={online:'Pago en línea',manual:'Pago directo',breb:'Bre-B / Nequi'}[n.method]||n.method||'—';
  const claimPend=n.status==='reserved'&&n.claimed;
  openModal(
    '<h2>Número <span class="pill '+(paid?'paid':'res')+'">'+k+'</span> '+(paid?'<span class="pill paid">PAGADO</span>':'<span class="pill res">RESERVADO</span>')+'</h2>'+
    (claimPend?'<div class="alert">🔔 El cliente marcó <b>“Ya transferí”</b>'+(n.claimedAt?' ('+new Date(n.claimedAt).toLocaleString('es')+')':'')+'. Verifica que el dinero llegó a tu Nequi y confirma.</div>':'')+
    '<div class="info"><div><b>Participante:</b> '+esc(n.buyer||'—')+'</div>'+
    '<div><b>Contacto:</b> '+esc(n.phone||'—')+'</div><div><b>Método:</b> '+esc(methodTxt)+'</div>'+
    '<div><b>Valor:</b> '+money(S.cfg.price)+'</div>'+
    (n.mpPaymentId?'<div><b>Pago MP:</b> '+esc(n.mpPaymentId)+'</div>':'')+
    (n.note?'<div><b>Nota:</b> '+esc(n.note)+'</div>':'')+
    (n.receipt?'<div><b>Comprobante:</b></div><img class="rcpt" src="'+esc(n.receipt)+'">':'')+'</div>'+
    '<div class="btns">'+
      (paid?'<button class="btn" onclick="act(\'mark-unpaid\',\''+k+'\')">↩ Quitar pago</button>'
           :'<button class="btn ok" onclick="act(\'mark-paid\',\''+k+'\')">✅ Marcar pagado</button>')+
      '<button class="btn danger" onclick="act(\'release\',\''+k+'\')">🗑 Liberar</button>'+
    '</div>'
  );
}
async function act(action,number){
  await api('/api/admin/'+action,{number});
  closeModal(); loadAndRender(); toast('Hecho');
}
function formReserve(k){
  openModal(
    '<h2>Reservar manualmente — '+k+'</h2>'+
    '<div class="field"><label>Nombre</label><input id="r_name"></div>'+
    '<div class="field"><label>WhatsApp</label><input id="r_phone"></div>'+
    '<div class="field"><label>Nota</label><input id="r_note"></div>'+
    '<div class="btns"><button class="btn" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn primary" onclick="doReserve(\''+k+'\')">Reservar</button></div>'
  );
}
async function doReserve(k){
  const buyer=$('r_name').value.trim(); if(!buyer){toast('Escribe el nombre');return;}
  const r=await api('/api/admin/reserve',{number:k,buyer,phone:$('r_phone').value.trim(),note:$('r_note').value.trim()});
  if(r.error){toast(r.error);return;}
  closeModal(); loadAndRender(); toast('Reservado');
}

/* ---- Config ---- */
var _qrData=null; // null = sin cambios; '' = quitar; dataURL = nuevo
function openConfig(){
  const c=S.cfg; const b=c.breb||{};
  _qrData=null;
  openModal(
    '<h2>⚙️ Configuración</h2>'+
    '<div class="field"><label>Nombre de la rifa</label><input id="c_name" value="'+esc(c.raffleName)+'"></div>'+
    '<div class="row"><div class="field"><label>Precio</label><input id="c_price" type="number" value="'+esc(c.price)+'"></div>'+
    '<div class="field"><label>Moneda</label><input id="c_cur" value="'+esc(c.currency)+'"></div></div>'+
    '<div class="row"><div class="field"><label>Hora sorteo</label><input id="c_draw" type="time" value="'+esc(c.drawTime)+'"></div>'+
    '<div class="field"><label>Liberar reservas (min antes)</label><input id="c_rel" type="number" value="'+esc(c.releaseMinutes)+'"></div></div>'+
    '<h2 style="font-size:16px;margin-top:18px">💳 Pago Bre-B / Nequi</h2>'+
    '<div class="info">Sube el <b>código QR que genera tu app Nequi</b> (o tu llave Bre-B). El cliente paga y pulsa “Ya transferí”; tú confirmas el pago manualmente al ver que llegó a tu Nequi.</div>'+
    '<label style="display:flex;align-items:center;gap:8px;margin:8px 0"><input type="checkbox" id="b_en"'+(b.enabled?' checked':'')+'> Activar pago Bre-B / Nequi</label>'+
    '<div class="field"><label>Llave Bre-B (celular, @ o alfanumérica)</label><input id="b_llave" value="'+esc(b.llave||'')+'" placeholder="@mirifa o 3001234567"></div>'+
    '<div class="row"><div class="field"><label>Titular de la cuenta</label><input id="b_benef" value="'+esc(b.beneficiary||'')+'"></div>'+
    '<div class="field"><label>Negocio (opcional)</label><input id="b_biz" value="'+esc(b.business||'')+'"></div></div>'+
    '<label style="display:flex;align-items:center;gap:8px;margin:8px 0"><input type="checkbox" id="b_rcpt"'+(b.requireReceipt?' checked':'')+'> Exigir comprobante (captura) al cliente</label>'+
    '<div class="field"><label>Imagen del QR</label><input type="file" id="b_qr" accept="image/*" onchange="onQR(event)"></div>'+
    '<div id="qrbox">'+(b.qrImage?'<img class="qr-prev" src="'+esc(b.qrImage)+'"><div><button class="btn danger" onclick="rmQR()">Quitar QR</button></div>':'<div class="mini">Sin QR cargado.</div>')+'</div>'+
    '<div class="info" style="margin-top:12px">El cobro automático en línea (Mercado Pago) se configura en el archivo <b>.env</b> del servidor.</div>'+
    '<div class="btns"><button class="btn" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn primary" onclick="saveConfig()">Guardar</button></div>'
  );
}
function onQR(e){
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  if(f.size>4*1024*1024){toast('La imagen es muy grande (máx 4MB)');e.target.value='';return;}
  const rd=new FileReader();
  rd.onload=()=>{ _qrData=rd.result; $('qrbox').innerHTML='<img class="qr-prev" src="'+_qrData+'"><div><button class="btn danger" onclick="rmQR()">Quitar QR</button></div>'; };
  rd.readAsDataURL(f);
}
function rmQR(){ _qrData=''; $('qrbox').innerHTML='<div class="mini">QR se quitará al guardar.</div>'; }
async function saveConfig(){
  const payload={raffleName:$('c_name').value.trim(),price:$('c_price').value,
    currency:$('c_cur').value.trim(),drawTime:$('c_draw').value,releaseMinutes:$('c_rel').value,
    breb:{enabled:$('b_en').checked,llave:$('b_llave').value.trim(),beneficiary:$('b_benef').value.trim(),
      business:$('b_biz').value.trim(),requireReceipt:$('b_rcpt').checked}};
  if(_qrData!==null) payload.breb.qrImage=_qrData;
  await api('/api/admin/config',payload);
  closeModal(); loadAndRender(); toast('Configuración guardada');
}
/* ---- Sorteo ---- */
function openDraw(){
  const paid=Object.values(S.numbers).filter(n=>n.status==='paid').length;
  openModal(
    '<h2>🎰 Realizar sorteo</h2>'+
    '<div class="info">Números pagados: <b>'+paid+'</b></div>'+
    '<div class="field"><label>Número ganador (manual)</label><input id="d_num" maxlength="2" placeholder="00-99" value="'+(S.winner||'')+'"></div>'+
    '<div class="btns"><button class="btn" onclick="draw(false)">🎲 Azar 00-99</button>'+
    '<button class="btn ok" onclick="draw(true)">🎲 Azar (pagados)</button></div>'+
    '<div class="btns"><button class="btn primary" onclick="drawManual()">🏆 Fijar ganador</button>'+
    (S.winner?'<button class="btn danger" onclick="clearWin()">Quitar</button>':'')+'</div>'
  );
}
async function draw(onlyPaid){ const r=await api('/api/admin/draw',{onlyPaid}); if(r.error){toast(r.error);return;} afterDraw(r); }
async function drawManual(){ const v=$('d_num').value.replace(/[^0-9]/g,''); if(v===''){toast('Ingresa 00-99');return;} const r=await api('/api/admin/draw',{number:v}); afterDraw(r); }
async function clearWin(){ await api('/api/admin/clear-winner',{}); closeModal(); loadAndRender(); }
function afterDraw(r){ closeModal(); loadAndRender(); toast('🏆 Ganador '+r.winner+(r.buyer?' — '+r.buyer+(r.status==='paid'?' (pagado)':' (sin pago)'):' (sin comprador)')); }

/* ---- Participantes ---- */
function buyersList(){ return Object.entries(S.numbers).filter(([,n])=>n.status!=='available').map(([num,n])=>({num,...n})).sort((a,b)=>a.num.localeCompare(b.num)); }
function openBuyers(){
  const l=buyersList();
  let rows=l.map(p=>{
    const stt=p.status==='paid'?'<span class="pill paid">Pagado</span>':'<span class="pill res">Reservado</span>'+(p.claimed?' 🔔':'');
    const mt={online:'En línea',manual:'Directo',breb:'Bre-B'}[p.method]||'';
    const a=p.status==='paid'?'<button class="btn" onclick="act2(\'mark-unpaid\',\''+p.num+'\')">Quitar</button>'
           :'<button class="btn ok" onclick="act2(\'mark-paid\',\''+p.num+'\')">Pagar</button>';
    return '<tr><td><b>'+p.num+'</b></td><td>'+esc(p.buyer||'—')+'<div class="mini">'+esc(p.phone||'')+(mt?' · '+mt:'')+'</div></td><td>'+stt+'</td>'+
      '<td>'+a+' <button class="btn danger" onclick="act2(\'release\',\''+p.num+'\')">🗑</button></td></tr>';
  }).join('');
  if(!rows)rows='<tr><td colspan="4" style="text-align:center;color:var(--mut);padding:18px">Sin participantes</td></tr>';
  openModal('<h2>📋 Participantes ('+l.length+')</h2><div class="tablewrap"><table><thead><tr><th>N°</th><th>Nombre</th><th>Estado</th><th>Acción</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="btns"><button class="btn" onclick="exportCSV()">⬇️ CSV</button><button class="btn" onclick="closeModal()">Cerrar</button></div>');
}
async function act2(action,number){ await api('/api/admin/'+action,{number}); S=await api('/api/admin/state'); openBuyers(); renderStats(); renderBoard(); }
function exportCSV(){
  let csv='Numero,Nombre,Telefono,Metodo,Estado,Valor\n';
  buyersList().forEach(p=>{csv+=[p.num,q(p.buyer),q(p.phone),q(p.method),p.status,S.cfg.price].join(',')+'\n';});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rifa_'+S.date+'.csv';a.click();
  function q(s){return '"'+String(s||'').replace(/"/g,'""')+'"';}
}

/* ---- Menu ---- */
function openMenu(){
  openModal('<h2>⋮ Opciones</h2>'+
    '<div class="btns"><button class="btn block" onclick="openHistory()">📚 Historial</button></div>'+
    '<div class="btns"><button class="btn block ok" onclick="newDay()">🌅 Cerrar día y empezar nuevo</button></div>'+
    '<div class="btns"><button class="btn block" onclick="logout()">🔓 Cerrar sesión</button></div>'+
    '<div class="info">La vista pública para los clientes es la página principal (/). Compártela; ahí no se puede configurar nada.</div>');
}
async function newDay(){ if(!confirm('¿Cerrar el día (se archiva) y empezar de cero?'))return; await api('/api/admin/new-day',{}); closeModal(); loadAndRender(); toast('Nuevo día'); }
function logout(){ PASS='';sessionStorage.removeItem('rifa_admin_pass'); renderLogin(); }
function openHistory(){
  let rows=(S.history||[]).map(h=>'<tr><td>'+h.date+'</td><td><b>'+(h.winner||'—')+'</b>'+(h.winnerBuyer?'<div class="mini">'+esc(h.winnerBuyer)+'</div>':'')+'</td><td>'+h.participants.length+'</td><td>'+money(h.revenue||0)+'</td></tr>').join('');
  if(!rows)rows='<tr><td colspan="4" style="text-align:center;color:var(--mut);padding:18px">Sin historial</td></tr>';
  openModal('<h2>📚 Historial</h2><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Ganador</th><th>Partic.</th><th>Recaudo</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="btns"><button class="btn" onclick="closeModal()">Cerrar</button></div>');
}

/* ---- Inicio ---- */
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
if(PASS) loadAndRender(); else renderLogin();
setInterval(()=>{ if(PASS && !$('modal').classList.contains('show')) loadAndRender(); }, 20000);
</script>
